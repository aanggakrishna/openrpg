name: Desktop app builds

on:
  workflow_dispatch:
  push:
    branches:
      - openrpg-vercel
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-13
            artifact: openrpg-macos-intel
          - os: macos-14
            artifact: openrpg-macos-apple-silicon
          - os: windows-latest
            artifact: openrpg-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install game and packaging dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Build app bundle
        run: python tools/package_desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true
      - name: Publish desktop downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-files/*.zip --repo "$GITHUB_REPOSITORY" --title "OpenRPG $GITHUB_REF_NAME" --notes "Standalone OpenRPG desktop apps. Download, extract, and open the app."
