import sys
import asyncio
import platform
import json
from pathlib import Path

# do not rename
async def custom_site():
    import embed
    platform.document.body.style.background = "#7f7f7f"

    platform.window.transfer.hidden = true
    platform.window.canvas.style.visibility = "visible"


    bundle = "pygbag-source"

    # the C or js loader could do that but be explicit.
    appdir = Path(f"/data/data/{bundle}") # /data/data/pygbag-source
    appdir.mkdir()


    # unpack filesystem from compressed archive into work dir
    if platform.window.location.host.find('.itch.zone')>0:
        import zipfile
        async with platform.fopen("pygbag-source.apk", "rb") as archive:
            with zipfile.ZipFile(archive) as zip_ref:
                zip_ref.extractall(appdir.as_posix())
    else:
        import tarfile
        async with platform.fopen("pygbag-source.tar.gz?rev=cbb49b0", "rb") as archive:
            tar = tarfile.open(fileobj=archive, mode="r:gz")
            tar.extractall(path=appdir.as_posix(), filter='tar')
            tar.close()

    # preloader will change to work dir and prepend it to sys.path
    platform.run_main(PyConfig, loaderhome= appdir / "assets", loadermain=None)


    # wait preloading complete : that includes images and wasm compilation of bundled modules
    while embed.counter()<0:
        await asyncio.sleep(.1)

    main = appdir / "assets" / "main.py"

    # TODO: test for window.webkitAudioContext and block aio loop until gesture if accessing media manager play
    # before a gesture is recorded ( touch or click )

    # test/wait user media interaction
    if not platform.window.MM.UME:

        # now that apk is mounted we have access to font cache
        # but we need to fill __file__ that is not yet set
        __import__(__name__).__file__ = main

        # now make a prompt
        msg  = "Ready to start ! Please click/touch page"
        platform.window.infobox.innerText = msg
        print("\n"*4, f"    * Waiting for media user engagement. {msg} *" , "\n"*4)

        while not platform.window.MM.UME:
            await asyncio.sleep(.1)

    # start async top level machinery if not started and add a console in any case if requested.
    await TopLevel_async_handler.start_toplevel(platform.shell, console=window.python.config.debug)

    # now that apk is mounted we have access to font cache
    # but we need to fill __file__/__name__ that are not yet set
    __import__(__name__).__file__ = main


    def ui_callback(pkg):
        platform.window.infobox.innerText = f"installing {pkg}"

    await shell.source(main, callback=ui_callback)

    # if you don't reach that step
    # your main.py has an infinite sync loop somewhere !

    platform.window.infobox.style.display = "none"
    platform.window.config.gui_divider = 1
    platform.window.window_resize()
    print("default.tmpl: done")

    shell.interactive()

asyncio.run( custom_site() )

    <script type="application/javascript">

    const fullscreenToggle = document.getElementById("fullscreen-toggle");
    const gameCanvas = document.getElementById("canvas");
    const fullscreenLabel = () => {
        const active = Boolean(document.fullscreenElement || document.webkitFullscreenElement);
        fullscreenToggle.textContent = active ? "EXIT FULLSCREEN" : "FULLSCREEN";
        fullscreenToggle.setAttribute("aria-pressed", String(active));
    };
    fullscreenToggle.addEventListener("click", async () => {
        try {
            if (document.fullscreenElement || document.webkitFullscreenElement) {
                await (document.exitFullscreen?.() || document.webkitExitFullscreen?.());
            } else {
                await (document.documentElement.requestFullscreen?.() || document.documentElement.webkitRequestFullscreen?.());
            }
        } catch (error) {
            console.warn("Fullscreen unavailable", error);
        }
        fullscreenLabel();
    });
    document.addEventListener("fullscreenchange", fullscreenLabel);
    document.addEventListener("webkitfullscreenchange", fullscreenLabel);

    const sendGameKey = (key, type) => {
        gameCanvas.focus({preventScroll:true});
        gameCanvas.dispatchEvent(new KeyboardEvent(type, {
            key, code: key === " " ? "Space" : key, bubbles:true, cancelable:true
        }));
    };
    // A real drag stick, not four D-pad buttons.  It uses arrow key holds so
    // the battle's A button stays exclusively available for basic attacks.
    const analog = document.getElementById("touch-analog");
    const analogKnob = document.getElementById("analog-knob");
    const heldAnalogKeys = new Set();
    let analogPointer = null;
    const setAnalogKeys = (nextKeys) => {
        for (const key of heldAnalogKeys) if (!nextKeys.has(key)) sendGameKey(key, "keyup");
        for (const key of nextKeys) if (!heldAnalogKeys.has(key)) sendGameKey(key, "keydown");
        heldAnalogKeys.clear();
        for (const key of nextKeys) heldAnalogKeys.add(key);
    };
    const moveAnalog = (event) => {
        if (analogPointer !== event.pointerId) return;
        const rect = analog.getBoundingClientRect();
        const radius = rect.width / 2;
        let dx = event.clientX - (rect.left + radius);
        let dy = event.clientY - (rect.top + radius);
        const limit = radius - 29;
        const distance = Math.hypot(dx, dy);
        if (distance > limit) { dx *= limit / distance; dy *= limit / distance; }
        analogKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
        const keys = new Set();
        const threshold = 18;
        if (dx < -threshold) keys.add("ArrowLeft");
        if (dx > threshold) keys.add("ArrowRight");
        if (dy < -threshold) keys.add("ArrowUp");
        if (dy > threshold) keys.add("ArrowDown");
        setAnalogKeys(keys);
    };
    const releaseAnalog = (event) => {
        if (event && analogPointer !== event.pointerId) return;
        setAnalogKeys(new Set());
        analogPointer = null;
        analogKnob.style.transform = "translate(-50%,-50%)";
    };
    analog.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        analogPointer = event.pointerId;
        analog.setPointerCapture?.(event.pointerId);
        moveAnalog(event);
    });
    analog.addEventListener("pointermove", moveAnalog);
    ["pointerup", "pointercancel", "lostpointercapture"].forEach((type) =>
        analog.addEventListener(type, releaseAnalog));
    window.addEventListener("blur", () => releaseAnalog());
    document.querySelectorAll("[data-tap-key]").forEach((button) => {
        button.addEventListener("pointerdown", (event) => {
            event.preventDefault();
            button.classList.add("is-held");
            const key = button.dataset.tapKey;
            sendGameKey(key, "keydown");
            window.setTimeout(() => sendGameKey(key, "keyup"), 80);
        });
        ["pointerup", "pointercancel", "pointerleave"].forEach((type) =>
            button.addEventListener(type, () => button.classList.remove("is-held")));
    });
    const touchActions = document.getElementById("touch-actions");
    const touchHint = document.getElementById("touch-hint");
    const mobileNameInput = document.getElementById("mobile-name-input");
    let virtualNameDirty = false;
    let wasNameInput = false;
    const battleButtons = [...document.querySelectorAll("[data-battle-key]")];
    const tapBattleButton = (button, event) => {
        event.preventDefault();
        if (button.disabled || button.classList.contains("cooling")) return;
        button.classList.add("is-held");
        const key = button.dataset.battleKey;
        sendGameKey(key, "keydown");
        window.setTimeout(() => sendGameKey(key, "keyup"), 80);
        window.setTimeout(() => button.classList.remove("is-held"), 110);
    };
    battleButtons.forEach((button) => button.addEventListener("pointerdown", (event) => tapBattleButton(button, event)));

    // game_engine.py publishes this small JSON snapshot from the real battle
    // state. The UI therefore never invents a cooldown or ultimate-ready flag.
    const setBattleButton = (key, cooldown, ready, label) => {
        const button = document.querySelector(`[data-battle-key="${key}"]`);
        if (!button) return;
        const cooling = cooldown > .04;
        button.classList.toggle("cooling", cooling);
        button.disabled = key === "r" ? !ready : cooling;
        if (key === "r") button.classList.toggle("ready", ready);
        const output = button.querySelector(".cooldown");
        if (output) output.textContent = label;
    };
    const updateMobileBattleUi = () => {
        let state;
        try { state = JSON.parse(window.openrpgMobileState || "{}"); } catch (_) { return; }
        const wantsNameInput = Boolean(state.nameInput);
        document.body.classList.toggle("name-entry", wantsNameInput);
        if (wantsNameInput) {
            const name = String(state.name || "");
            if (!wasNameInput || (!virtualNameDirty && mobileNameInput.value !== name)) mobileNameInput.value = name;
            if (virtualNameDirty && mobileNameInput.value === name) virtualNameDirty = false;
        } else if (!wantsNameInput) {
            mobileNameInput.value = "";
            window.openrpgMobileNameInput = "";
            virtualNameDirty = false;
        }
        wasNameInput = wantsNameInput;
        const battle = state.battle;
        const active = state.mode === "battle" && battle && !battle.locked;
        touchActions.classList.toggle("is-battle", Boolean(active));
        touchHint.textContent = active ? "ANALOG · A ATTACK · Q / W / E SKILLS · R ULT" : "ANALOG · ACT · HIT · BAG · MENU";
        if (!active) return;
        const basicCooldown = Number(battle.basicCooldown || 0);
        const skillCooldown = Number(battle.skillCooldown || 0);
        const ultimateReady = Boolean(battle.ultimateReady);
        const meter = Math.round(Number(battle.ultimateMeter || 0));
        setBattleButton("a", basicCooldown, !basicCooldown, basicCooldown ? `${basicCooldown.toFixed(1)}s` : "READY");
        ["q", "w", "e"].forEach((key) => setBattleButton(key, skillCooldown, !skillCooldown, skillCooldown ? `${skillCooldown.toFixed(1)}s` : "READY"));
        setBattleButton("r", 0, ultimateReady, ultimateReady ? "READY" : `${meter}%`);
    };
    window.setInterval(updateMobileBattleUi, 100);
    mobileNameInput.addEventListener("input", () => {
        window.openrpgMobileNameInput = mobileNameInput.value.slice(0, 18);
    });
    mobileNameInput.addEventListener("keydown", (event) => {
        if (event.key !== "Enter") return;
        event.preventDefault();
        sendGameKey("Enter", "keydown");
        window.setTimeout(() => sendGameKey("Enter", "keyup"), 80);
    });
    const setVirtualName = (value) => {
        mobileNameInput.value = value.slice(0, 18);
        window.openrpgMobileNameInput = mobileNameInput.value;
        virtualNameDirty = true;
    };
    document.querySelectorAll("[data-name-key]").forEach((button) => button.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        const key = button.dataset.nameKey;
        if (key === "done") {
            sendGameKey("Enter", "keydown");
            window.setTimeout(() => sendGameKey("Enter", "keyup"), 80);
            return;
        }
        if (key === "backspace") setVirtualName(mobileNameInput.value.slice(0, -1));
        else setVirtualName(mobileNameInput.value + (key === "space" ? " " : key));
    }));
    const enterMobileLandscape = async () => {
        try {
            if (!document.fullscreenElement) await document.documentElement.requestFullscreen?.();
            await screen.orientation?.lock?.("landscape");
        } catch (error) {
            // iOS may reject orientation locks; its rotation prompt remains visible.
            console.info("Landscape lock unavailable", error);
        }
        fullscreenLabel();
    };
    document.getElementById("landscape-start").addEventListener("click", enterMobileLandscape);

    globalThis.__canvas_resized = (self, ecw, ech) => {
        console.warn("TODO: panda3d canvas monitor", self, ecw, ech)
    }

        console.log(__FILE__, "custom_prerun")

        // allow to gain access to dev tools from js console
        // but only on desktop. difficult to reach when in iframe
        python.config.debug = true

        document.getElementById("info").innerHTML = data
    }

        fetch( url /*, options */)
            .then((response) => response.text())

                info_inline(html);
        })
        .catch((error) => {
            console.warn(error);
        });
